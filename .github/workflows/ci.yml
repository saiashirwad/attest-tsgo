name: CI

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Packed JavaScript on the minimum Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm run test:package
